<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de ahorro</title>
  <!-- <link rel="stylesheet" href="estilos.css"> -->
</head>
<body>
  <h1>Mi calculadora de ahorro</h1>
  <p> Descubre cuántos meses necesitas para alcanzar tu objetivo.</p>
  
  <label for="ahorro-inicial">¿Cuánto dinero tienes ahora?</label>
  <input type="number" id="ahorro-inicial" value="0">
  
  <label for="ahorro-mensual">¿Cuánto ahorrarás al mes?</label>
  <input type="number" id="ahorro-mensual" value="0">

  <label for="ahorro-objetivo">¿Cuánto quieres conseguir?</label>
  <input type="number" id="ahorro-objetivo" value="1000">

  <button id="boton-calcular">Calcular</button>

  <p id="resultado">El resultado aparecerá aquí.</p>
  
  <script>
  const boton = document.getElementById("boton-calcular");
  boton.addEventListener("click", function () {
    const inicial = Number(document.getElementById("ahorro-inicial").value);
    const mensual = Number(document.getElementById("ahorro-mensual").value);
    const objetivo = Number(document.getElementById("ahorro-objetivo").value);
    const resultado = document.getElementById("resultado");

    if (objetivo <= inicial) {
        resultado.textContent = "¡Ya has alcanzado tu objetivo!";
    } else if (mensual <= 0) {
        resultado.textContent = " El ahorro mensual debe ser mayor que 0 ";
    } else {
      const meses = Math.ceil((objetivo - inicial) / mensual);
      resultado.textContent =  `Necesitas ${meses} meses para alcanzar tu objetivo. `;
    }
  });
   
  </script>
</body>
</html>
